name: "Bug Report"
description: "버그를 제보합니다"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 버그 요약
      description: 어떤 문제가 발생했는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 순서대로 작성해 주세요.
      placeholder: |
        1. 페이지 이동
        2. 버튼 클릭
        3. 오류 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 실행 환경
      placeholder: "예: macOS 14 / Chrome 123"
