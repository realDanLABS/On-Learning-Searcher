openapi: 3.0.3
info:
  title: On Learning Searcher API
  version: 0.1.0
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
            traceId:
              type: string
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Healthy
  /auth/session:
    get:
      summary: Get current auth session
      responses:
        '200':
          description: Auth session payload
  /auth/callback:
    get:
      summary: Complete auth callback and return normalized session
      responses:
        '200':
          description: Auth session payload
  /profile:
    put:
      summary: Upsert current user profile
      responses:
        '200':
          description: Saved profile payload
  /diagnosis:
    post:
      summary: Submit diagnosis result
      responses:
        '200':
          description: Saved
    get:
      summary: Get latest diagnosis
      responses:
        '200':
          description: Diagnosis payload
  /recommendations:
    get:
      summary: Get recommended courses from diagnosis context
      parameters:
        - in: query
          name: level
          schema:
            type: string
            enum: [all, 입문, 중급, 심화]
      responses:
        '200':
          description: Course list
  /recommendations/select:
    post:
      summary: Select one recommendation for enrollment linking
      responses:
        '200':
          description: Saved
  /selected-course:
    get:
      summary: Get current selected course
      responses:
        '200':
          description: Selected course payload
  /enrollments:
    post:
      summary: Submit enrollment result
      responses:
        '200':
          description: Saved
    get:
      summary: Get enrollment history
      responses:
        '200':
          description: Enrollment list
  /journey/events:
    get:
      summary: Get journey events timeline
      responses:
        '200':
          description: Timeline events
  /journey/stage:
    get:
      summary: Get current journey stage
      responses:
        '200':
          description: One of start/diagnosis_done/course_selected/enrollment_done
